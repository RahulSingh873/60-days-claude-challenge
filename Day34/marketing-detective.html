<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marketing Detective</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg-0:#070c09;
  --bg-1:#0d1712;
  --board:#123024;
  --board-2:#16392b;
  --gold:#d8b25c;
  --gold-bright:#f2d089;
  --emerald:#2f9e6e;
  --emerald-bright:#43c98a;
  --paper:#f3e9d2;
  --paper-2:#ece0c4;
  --ink:#2a2117;
  --red-string:#b23b3b;
  --shadow:rgba(0,0,0,.6);
  --glow:0 0 18px rgba(67,201,138,.45);
  --font-head:'Georgia','Times New Roman',serif;
  --font-body:'Trebuchet MS',Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    radial-gradient(circle at 20% 10%, rgba(67,201,138,.06), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(216,178,92,.05), transparent 40%),
    var(--bg-0);
  color:var(--paper);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
}
#app{min-height:100vh;position:relative;}
.noise-overlay{
  position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.05;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px, transparent 1px 3px);
}
h1,h2,h3{font-family:var(--font-head);letter-spacing:.5px;}
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:6px;}
::-webkit-scrollbar-track{background:var(--bg-1);}

/* ---------- SCREEN TRANSITIONS ---------- */
.screen{
  animation: fadeSlideIn .6s ease both;
  padding:24px;
  max-width:1200px;
  margin:0 auto;
}
@keyframes fadeSlideIn{
  from{opacity:0; transform:translateY(18px);}
  to{opacity:1; transform:translateY(0);}
}
.fadeOut{ animation: fadeOutDown .45s ease both; }
@keyframes fadeOutDown{
  to{opacity:0; transform:translateY(-14px);}
}

/* ---------- BUTTONS ---------- */
button{
  font-family:var(--font-body);
  cursor:pointer;
  border:none;
  outline:none;
}
.btn{
  background:linear-gradient(160deg, var(--emerald-bright), var(--emerald));
  color:#06150e;
  font-weight:700;
  padding:14px 30px;
  border-radius:8px;
  font-size:16px;
  letter-spacing:.5px;
  box-shadow:0 6px 18px rgba(47,158,110,.35), inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
}
.btn:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(47,158,110,.5), inset 0 1px 0 rgba(255,255,255,.35); filter:brightness(1.07);}
.btn:active{ transform:translateY(0px) scale(.98); }
.btn.gold{
  background:linear-gradient(160deg, var(--gold-bright), var(--gold));
  color:#241b06;
  box-shadow:0 6px 18px rgba(216,178,92,.35), inset 0 1px 0 rgba(255,255,255,.3);
}
.btn.gold:hover{ box-shadow:0 10px 26px rgba(216,178,92,.5); }
.btn.ghost{
  background:transparent;
  color:var(--gold-bright);
  border:1.5px solid rgba(216,178,92,.5);
  box-shadow:none;
}
.btn.ghost:hover{ background:rgba(216,178,92,.08); }
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none; filter:none;}

/* ---------- COVER / INTRO ---------- */
.cover{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  padding:20px;
}
.badge-icon{
  width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 60%, #8a6a24 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:52px;
  box-shadow:0 0 40px rgba(216,178,92,.45), inset 0 2px 6px rgba(255,255,255,.4), inset 0 -4px 8px rgba(0,0,0,.3);
  margin-bottom:22px;
  animation:pulseGlow 3s ease-in-out infinite;
}
@keyframes pulseGlow{
  0%,100%{ box-shadow:0 0 30px rgba(216,178,92,.35), inset 0 2px 6px rgba(255,255,255,.4);}
  50%{ box-shadow:0 0 50px rgba(216,178,92,.6), inset 0 2px 6px rgba(255,255,255,.4);}
}
.cover h1{
  font-size:clamp(32px,6vw,58px);
  color:var(--gold-bright);
  text-shadow:0 0 30px rgba(216,178,92,.35);
  margin:0 0 6px;
}
.cover .subtitle{
  color:var(--paper-2);
  opacity:.85;
  font-size:18px;
  margin-bottom:36px;
  max-width:560px;
}
.typewriter{
  font-family:'Courier New',monospace;
  color:var(--emerald-bright);
  font-size:15px;
  min-height:24px;
  margin-bottom:30px;
  opacity:.9;
}
.blinker{ animation:blink 1s step-start infinite; }
@keyframes blink{ 50%{opacity:0;} }

/* ---------- CASE FILE INTAKE ---------- */
.folder{
  background:var(--paper);
  color:var(--ink);
  border-radius:4px 14px 14px 4px;
  box-shadow:0 20px 45px var(--shadow), 0 2px 0 #cbb98c inset;
  padding:34px 38px;
  position:relative;
  max-width:720px;
  margin:0 auto;
  transform:rotate(-.4deg);
}
.folder::before{
  content:"";
  position:absolute; top:-14px; left:36px;
  width:120px;height:26px;
  background:var(--paper-2);
  border-radius:6px 6px 0 0;
  box-shadow:0 -1px 0 rgba(0,0,0,.06);
}
.stamp{
  position:absolute; top:18px; right:26px;
  border:3px solid var(--red-string);
  color:var(--red-string);
  padding:4px 12px;
  font-weight:800;
  font-family:var(--font-head);
  transform:rotate(8deg);
  border-radius:6px;
  letter-spacing:2px;
  opacity:.85;
  font-size:13px;
}
.case-label{
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#7a6a44;
  margin-bottom:6px;
}
.case-title{
  font-size:28px;
  margin:0 0 14px;
  color:#3c2f16;
}
.case-meta{
  display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;
}
.tag{
  background:rgba(47,158,110,.12);
  border:1px solid rgba(47,158,110,.4);
  color:#1c5f42;
  padding:4px 12px;
  border-radius:20px;
  font-size:12.5px;
  font-weight:700;
}
.case-brief{
  line-height:1.6;
  font-size:15.5px;
  color:#3a2f1c;
}
.divider-dashed{
  border:none;border-top:2px dashed #c7b98a; margin:18px 0;
}

/* ---------- THEME PICKER ---------- */
.theme-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:16px;
  max-width:640px;
  margin:0 auto 34px;
}
.theme-card{
  background:var(--bg-1);
  border:2px solid rgba(216,178,92,.25);
  border-radius:12px;
  padding:16px;
  cursor:pointer;
  transition:.2s ease;
  text-align:center;
}
.theme-card:hover{ transform:translateY(-4px); border-color:var(--gold); }
.theme-card.selected{ border-color:var(--emerald-bright); box-shadow:var(--glow); }
.swatch-row{ display:flex; justify-content:center; gap:6px; margin-bottom:10px; }
.swatch{ width:22px;height:22px;border-radius:50%; box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);}
.theme-name{ font-size:13px; font-weight:700; color:var(--paper-2);}

/* ---------- INVESTIGATION BOARD ---------- */
.corkboard{
  background:
    repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 6px),
    radial-gradient(circle at 30% 20%, #17402f, #0e2419 70%);
  border-radius:16px;
  border:10px solid #23180d;
  box-shadow:0 30px 60px var(--shadow), inset 0 0 60px rgba(0,0,0,.5);
  padding:28px;
  position:relative;
  min-height:70vh;
}
.board-header{
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
  margin-bottom:22px;
}
.board-title{ color:var(--gold-bright); font-size:24px; margin:0;}
.progress-wrap{
  display:flex; align-items:center; gap:10px;
  color:var(--paper-2); font-size:13px;
}
.progress-track{
  width:160px; height:10px; border-radius:6px;
  background:rgba(255,255,255,.08);
  overflow:hidden;
  border:1px solid rgba(216,178,92,.3);
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg, var(--emerald), var(--gold));
  transition:width .5s ease;
}
.evidence-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:22px;
}
.evidence-card{
  background:var(--paper);
  color:var(--ink);
  border-radius:6px;
  padding:16px 16px 20px;
  box-shadow:0 12px 24px var(--shadow);
  position:relative;
  cursor:grab;
  transform:rotate(var(--rot,0deg));
  transition:transform .25s ease, box-shadow .25s ease;
  user-select:none;
}
.evidence-card:hover{
  transform:rotate(0deg) scale(1.035) translateY(-4px);
  box-shadow:0 20px 34px var(--shadow), var(--glow);
  z-index:5;
}
.evidence-card.dragging{ opacity:.55; }
.evidence-card.examined{
  box-shadow:0 12px 24px var(--shadow), 0 0 0 2px var(--emerald-bright);
}
.pin{
  position:absolute; top:-10px; left:50%; transform:translateX(-50%);
  width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff8a8a, var(--red-string) 70%);
  box-shadow:0 3px 6px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,.5);
}
.evidence-icon{ font-size:26px; margin-bottom:8px; display:block;}
.evidence-label{
  font-family:var(--font-head);
  font-size:15px; font-weight:700; margin-bottom:6px; color:#2c2314;
}
.evidence-hint{ font-size:12px; color:#6b5a37; }
.sticky{
  background:linear-gradient(160deg, #fff4b0, #fbe37a);
  color:#3a3210;
  transform:rotate(var(--rot,-2deg));
}
.sticky .evidence-hint{ color:#6a5c14; }
.folder-card{
  background:var(--paper-2);
  border-top:14px solid #d8c48c;
}
.string-svg{
  position:absolute; inset:0; pointer-events:none; z-index:1;
}
.badge-new{
  position:absolute; top:8px; right:8px;
  background:var(--red-string); color:#fff;
  font-size:9px; font-weight:800; letter-spacing:1px;
  padding:2px 6px; border-radius:10px;
}

/* ---------- MODAL (Clue detail) ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(3,8,5,.75);
  display:flex; align-items:center; justify-content:center; z-index:200;
  animation:fadeIn .3s ease;
  padding:16px;
}
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.modal-card{
  background:var(--paper);
  color:var(--ink);
  border-radius:10px;
  max-width:560px; width:100%;
  padding:28px 30px;
  box-shadow:0 30px 70px rgba(0,0,0,.7);
  animation:popIn .35s cubic-bezier(.2,.9,.3,1.2);
  max-height:85vh; overflow-y:auto;
}
@keyframes popIn{
  from{opacity:0; transform:scale(.85) translateY(20px);}
  to{opacity:1; transform:scale(1) translateY(0);}
}
.modal-card h3{ margin-top:0; color:#2c2314; font-size:22px;}
.modal-close{
  float:right; background:none; border:none; font-size:20px; color:#7a6a44; cursor:pointer;
}
.metric-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin:16px 0;
}
.metric-box{
  background:rgba(47,158,110,.08);
  border:1px solid rgba(47,158,110,.3);
  border-radius:8px; padding:10px; text-align:center;
}
.metric-num{ font-size:20px; font-weight:800; color:#1c5f42;}
.metric-lbl{ font-size:11px; text-transform:uppercase; color:#6b5a37; letter-spacing:.5px;}
.chart-bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.chart-bar-label{ width:90px; font-size:12px; color:#4a3d24;}
.chart-bar-track{ flex:1; background:rgba(0,0,0,.08); border-radius:6px; overflow:hidden; height:14px;}
.chart-bar-fill{
  height:100%; background:linear-gradient(90deg,var(--emerald),var(--gold));
  width:0%; transition:width 1s ease;
  border-radius:6px;
}
.comment-item{
  background:#fff; border-left:3px solid var(--gold); padding:8px 12px; margin-bottom:8px;
  font-style:italic; font-size:13.5px; border-radius:0 6px 6px 0; color:#4a3d24;
}

/* ---------- SOLVE SCREEN ---------- */
.solve-panel{
  background:var(--board);
  border:2px solid rgba(216,178,92,.3);
  border-radius:16px;
  padding:30px;
  box-shadow:0 30px 60px var(--shadow);
}
.option-list{ display:flex; flex-direction:column; gap:12px; margin:20px 0;}
.option-item{
  background:var(--bg-1);
  border:2px solid rgba(255,255,255,.08);
  border-radius:10px;
  padding:16px 18px;
  cursor:pointer;
  transition:.2s ease;
  color:var(--paper-2);
  font-size:15px;
}
.option-item:hover{ border-color:var(--gold); transform:translateX(4px); }
.option-item.selected{ border-color:var(--emerald-bright); background:rgba(47,158,110,.12); box-shadow:var(--glow);}
.option-item.correct{ border-color:var(--emerald-bright); background:rgba(47,158,110,.22); }
.option-item.wrong{ border-color:var(--red-string); background:rgba(178,59,59,.18); }
.clue-select-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin:16px 0 24px;
}
.mini-evidence{
  background:var(--paper);
  color:var(--ink);
  border-radius:6px; padding:10px 12px; font-size:13px; cursor:pointer;
  border:3px solid transparent;
  transition:.2s ease;
}
.mini-evidence:hover{ transform:translateY(-2px);}
.mini-evidence.picked{ border-color:var(--emerald-bright); box-shadow:var(--glow); }

/* ---------- CASE CLOSED ---------- */
.closed-screen{
  min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  position:relative;
}
.stamp-big{
  font-family:var(--font-head);
  font-size:clamp(40px,9vw,90px);
  color:var(--red-string);
  border:6px solid var(--red-string);
  padding:10px 34px;
  border-radius:14px;
  transform:rotate(-8deg) scale(0);
  animation:stampIn .5s .2s cubic-bezier(.3,1.6,.4,1) forwards;
  letter-spacing:4px;
  margin-bottom:26px;
}
@keyframes stampIn{
  to{ transform:rotate(-8deg) scale(1); }
}
.confetti-piece{
  position:absolute; width:8px;height:14px; top:-20px; opacity:.9;
  animation:fall linear forwards;
}
@keyframes fall{
  to{ transform:translateY(110vh) rotate(720deg); opacity:0;}
}
.score-line{ font-size:19px; color:var(--paper-2); margin-bottom:6px;}
.score-big{ color:var(--gold-bright); font-weight:800; font-size:26px;}

/* ---------- LEARNING REPORT ---------- */
.report-card{
  background:var(--paper);
  color:var(--ink);
  border-radius:10px;
  padding:30px 34px;
  box-shadow:0 30px 60px var(--shadow);
  max-width:760px; margin:0 auto;
}
.report-section{ margin-bottom:20px; }
.report-section h3{ color:#1c5f42; border-bottom:2px solid #cbb98c; padding-bottom:6px; margin-bottom:10px;}
.improve-list li{ margin-bottom:8px; line-height:1.5; }
.chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.chip{
  background:rgba(47,158,110,.12); border:1px solid rgba(47,158,110,.4);
  color:#1c5f42; padding:4px 10px; border-radius:16px; font-size:12px; font-weight:700;
}

.footer-actions{
  display:flex; gap:14px; justify-content:center; margin-top:30px; flex-wrap:wrap;
}

@media (max-width:640px){
  .folder{ padding:22px 20px; }
  .corkboard{ padding:16px; }
}
</style>
</head>
<body>
<div class="noise-overlay"></div>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ============================================================
   THEME PRESETS
   ============================================================ */
const THEMES = {
  emerald: { name:"Emerald Case Files", vars:{
    "--board":"#123024","--board-2":"#16392b","--gold":"#d8b25c","--gold-bright":"#f2d089",
    "--emerald":"#2f9e6e","--emerald-bright":"#43c98a","--red-string":"#b23b3b"
  }, swatches:["#2f9e6e","#d8b25c","#123024"]},
  claudeOrange: { name:"Claude Orange", vars:{
    "--board":"#2c1608","--board-2":"#3a1f0d","--gold":"#e8874a","--gold-bright":"#ffab6b",
    "--emerald":"#cc6a30","--emerald-bright":"#ff8c4b","--red-string":"#8a2f2f"
  }, swatches:["#e8874a","#ffab6b","#2c1608"]},
  noir: { name:"Classic Noir", vars:{
    "--board":"#1a1f26","--board-2":"#232a33","--gold":"#9fb3c8","--gold-bright":"#cddcec",
    "--emerald":"#5b7a91","--emerald-bright":"#7ea3bd","--red-string":"#b23b3b"
  }, swatches:["#5b7a91","#cddcec","#1a1f26"]},
  crimson: { name:"Crimson Investigation", vars:{
    "--board":"#2a0f0f","--board-2":"#3a1414","--gold":"#c98a3a","--gold-bright":"#e8ab5c",

  }, swatches:["#b23b3b","#e8ab5c","#2a0f0f"]}
};

function applyTheme(key){
  const t = THEMES[key] || THEMES.emerald;
  const root = document.documentElement;
  Object.entries(t.vars).forEach(([k,v])=> root.style.setProperty(k,v));
}

/* ============================================================
   CASE DATA — 10 fictional marketing cases
   ============================================================ */
const CASES = [
{
  id:1,
  company:"Lumino Skincare",
  industry:"Beauty & Personal Care",
  objective:"Drive trial of new vitamin-C serum among urban millennials",
  audience:"Women 22-35, urban, skincare-conscious, mid-to-high income",
  channels:["Instagram Ads","Influencer Seeding","Email","Retail Endcaps"],

  comments:[
    "Saw 5 different influencers post the same caption word-for-word, felt fake.",
    "Ad looked exactly like the one I saw yesterday, and the one before.",
    "Nice product but the ad doesn't tell me what makes it different from The Ordinary."
  ],
  social:{ instagramLikes:"12K", shareRate:"0.8%", sentiment:"Mixed – 54% positive", commentsFlag:"Frequent 'seen this everywhere' comments" },
  mistake:"Over-saturated identical creative across too many influencers simultaneously, causing ad fatigue and inauthenticity perception.",
  clues:[
    "CTR dropped 60% between week 1 and week 3 despite unchanged spend.",
    "Influencer captions were nearly identical across 14 creators (brand-provided script, zero variation allowed).",
    "Customer comments repeatedly mention 'seeing the same post everywhere.'"
  ],
  explanation:"The brand mandated a single locked script for all influencers and ran the same static ad creative in tight rotation without refresh, producing rapid creative fatigue and a sense of inauthentic, manufactured hype rather than genuine advocacy.",
  improvements:[

    "Rotate ad creative every 5-7 days to avoid fatigue.",
    "Stagger influencer posting schedule instead of simultaneous drops.",

  ]
},
{
  id:2,
  company:"PeakStride Footwear",

  ],
  social:{ instagramLikes:"—", shareRate:"n/a", sentiment:"Negative – frustration with UX", commentsFlag:"Multiple complaints of broken landing page links" },
  mistake:"High-performing ad creative funneled users to a generic homepage instead of the specific product landing page, causing massive funnel drop-off despite strong click-through.",
  clues:[
    "CTR was strong at 1.1%, well above industry benchmark of 0.9%.",

  ],

  improvements:[

    "Build dedicated, fast-loading landing pages matching ad promise (message match).",
    "Cap retargeting frequency to 3-4 impressions/week per user to reduce fatigue.",
    "Set up automated QA alerts for landing page mismatches."
  ]
},
{
  id:3,
  company:"BrewHaven Coffee Co.",
  industry:"Food & Beverage",
  objective:"Increase foot traffic to 40 new franchise locations",
  audience:"Local commuters 25-55, within 3 miles of stores",
  channels:["Local Radio","Geofenced Mobile Ads","Direct Mail","Facebook Local Awareness"],
  budget:{ "Radio":20, "Geofencing":35, "Direct Mail":25, "Facebook":20 },
  metrics:{ reach:"890K", ctr:"0.65%", engagement:"1.4%", conversions:"210 store visits", sales:"$14,200" },
  comments:[
    "Got the mailer coupon two days AFTER it expired.",
    "The ad said 'grand opening this weekend' but the store had already been open a month.",

/* ============================================================
   UTILITIES
   ============================================================ */
function pickRandomCase(excludeId){
  let pool = CASES;
  if(excludeId!=null && CASES.length>1){ pool = CASES.filter(c=>c.id!==excludeId); }
  return pool[Math.floor(Math.random()*pool.length)];
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function el(tag, props, ...children){
  const e = document.createElement(tag);
  if(props){
    Object.entries(props).forEach(([k,v])=>{
      if(k==="class") e.className = v;
      else if(k==="html") e.innerHTML = v;
      else if(k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
      else if(v!==undefined && v!==null) e.setAttribute(k, v);
    });
  }
  children.flat().forEach(c=>{
    if(c==null) return;
    if(typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

/* ============================================================
   APP STATE MACHINE
   ============================================================ */
const root = document.getElementById("app");
const state = {
  screen:"intro", // intro -> theme -> assign -> board -> solve -> closed -> report
  theme:"emerald",
  currentCase:null,
  examinedClues:new Set(), // indices of clues examined (0,1,2 = supporting; 'mistakeCard','metrics','comments','social','budget')
  selectedMistakeOption:null,
  mistakeLocked:false,
  selectedClueIdx:new Set(),
  score:0,
  startTime:null
};

const EVIDENCE_DEFS = [
  { key:"objective", icon:"🎯", label:"Campaign Objective", type:"folder" },
  { key:"audience", icon:"👥", label:"Target Audience", type:"folder" },
  { key:"channels", icon:"📡", label:"Marketing Channels", type:"folder" },
  { key:"budget", icon:"💰", label:"Budget Allocation", type:"folder" },
  { key:"metrics", icon:"📊", label:"Campaign Metrics", type:"sticky" },
  { key:"comments", icon:"💬", label:"Customer Comments", type:"sticky" },
  { key:"social", icon:"📱", label:"Social Performance", type:"sticky" },
  { key:"clue0", icon:"🔎", label:"Field Clue #1", type:"pin" },
  { key:"clue1", icon:"🔎", label:"Field Clue #2", type:"pin" },
  { key:"clue2", icon:"🔎", label:"Field Clue #3", type:"pin" }
];

function render(){
  root.innerHTML = "";
  root.appendChild(document.createElement("div"));
  root.firstChild.remove();
  const screenEl = buildScreen();
  root.appendChild(screenEl);
}

function transitionTo(newScreen, cb){
  const current = root.querySelector(".screen");
  if(current){
    current.classList.add("fadeOut");
    setTimeout(()=>{ state.screen = newScreen; if(cb) cb(); render(); }, 380);
  } else {
    state.screen = newScreen; if(cb) cb(); render();
  }
}

function buildScreen(){
  switch(state.screen){
    case "intro": return screenIntro();
    case "theme": return screenTheme();
    case "assign": return screenAssign();
    case "board": return screenBoard();
    case "solve": return screenSolve();
    case "closed": return screenClosed();
    case "report": return screenReport();
    default: return screenIntro();
  }
}

/* ---------- SCREEN: INVESTIGATION BOARD ---------- */
let dragSrc = null;

function openClueModal(defKey){
  state.examinedClues.add(defKey);
  const c = state.currentCase;
  const backdrop = el("div", {class:"modal-backdrop", onClick:(e)=>{ if(e.target===backdrop) backdrop.remove(); }});
  const card = el("div", {class:"modal-card"});
  card.appendChild(el("button", {class:"modal-close", onClick:()=> backdrop.remove()}, "✕"));

  if(defKey==="objective"){
    card.appendChild(el("h3", null, "🎯 Campaign Objective"));
    card.appendChild(el("p", null, c.objective));
  } else if(defKey==="audience"){
    card.appendChild(el("h3", null, "👥 Target Audience"));
    card.appendChild(el("p", null, c.audience));
  } else if(defKey==="channels"){
    card.appendChild(el("h3", null, "📡 Marketing Channels Used"));
    const ul = el("ul", null);
    c.channels.forEach(ch=> ul.appendChild(el("li", null, ch)));
    card.appendChild(ul);
  } else if(defKey==="budget"){
    card.appendChild(el("h3", null, "💰 Budget Allocation"));
    Object.entries(c.budget).forEach(([label,pct])=>{
      const row = el("div", {class:"chart-bar-row"});
      row.appendChild(el("div", {class:"chart-bar-label"}, label));
      const track = el("div", {class:"chart-bar-track"});
      const fill = el("div", {class:"chart-bar-fill"});
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el("div", null, pct+"%"));
      card.appendChild(row);
      setTimeout(()=>{ fill.style.width = pct+"%"; }, 60);
    });
  } else if(defKey==="metrics"){
    card.appendChild(el("h3", null, "📊 Campaign Metrics"));
    const grid = el("div", {class:"metric-grid"});
    const m = c.metrics;
    [["Reach",m.reach],["CTR",m.ctr],["Engagement",m.engagement],["Conversions",m.conversions],["Sales",m.sales]].forEach(([lbl,val])=>{
      grid.appendChild(el("div", {class:"metric-box"}, el("div",{class:"metric-num"},val), el("div",{class:"metric-lbl"},lbl)));
    });
    card.appendChild(grid);
  } else if(defKey==="comments"){
    card.appendChild(el("h3", null, "💬 Customer Comments"));
    c.comments.forEach(txt=> card.appendChild(el("div", {class:"comment-item"}, "“"+txt+"”")));
  } else if(defKey==="social"){
    card.appendChild(el("h3", null, "📱 Social Media Performance"));
    const s = c.social;
    const grid = el("div", {class:"metric-grid"});
    Object.entries(s).forEach(([k,v])=>{
      const lbl = k.replace(/([A-Z])/g," $1").replace(/^./,ch=>ch.toUpperCase());
      grid.appendChild(el("div",{class:"metric-box"}, el("div",{class:"metric-num", style:"font-size:14px;"},String(v)), el("div",{class:"metric-lbl"},lbl)));
    });
    card.appendChild(grid);
  } else if(defKey==="clue0" || defKey==="clue1" || defKey==="clue2"){
    const idx = Number(defKey.slice(-1));
    card.appendChild(el("h3", null, `🔎 Field Clue #${idx+1}`));
    card.appendChild(el("p", null, c.clues[idx]));
  }
  backdrop.appendChild(card);
  document.body.appendChild(backdrop);
}

function screenBoard(){
  const c = state.currentCase;
  const wrap = el("div", {class:"screen"});
  const cork = el("div", {class:"corkboard"});

  const header = el("div", {class:"board-header"});
  header.appendChild(el("h2", {class:"board-title"}, `🗂 Investigation Board — ${c.company}`));
  const pct = Math.round((state.examinedClues.size / EVIDENCE_DEFS.length) * 100);
  const progWrap = el("div", {class:"progress-wrap"});
  progWrap.appendChild(el("span", null, `Evidence examined: ${state.examinedClues.size}/${EVIDENCE_DEFS.length}`));
  const track = el("div", {class:"progress-track"});
  track.appendChild(el("div", {class:"progress-fill", style:`width:${pct}%`}));
  progWrap.appendChild(track);
  header.appendChild(progWrap);
  cork.appendChild(header);

  cork.appendChild(el("p", {style:"color:var(--paper-2);opacity:.75;font-size:13.5px;margin:-10px 0 18px;"},
    "Drag evidence around the board to rearrange, click any item to examine it closely."));

  const grid = el("div", {class:"evidence-grid"});
  EVIDENCE_DEFS.forEach((def, i)=>{
    const rot = (i % 5 - 2) * 1.6;
    const isSticky = def.type === "sticky";
    const isFolder = def.type === "folder";
    const classes = ["evidence-card"];
    if(isSticky) classes.push("sticky");
    if(isFolder) classes.push("folder-card");
    if(state.examinedClues.has(def.key)) classes.push("examined");
    const cardEl = el("div", {
      class:classes.join(" "),
      style:`--rot:${rot}deg;`,
      draggable:"true",
      onClick:()=> openClueModal(def.key),
      onDragstart:(e)=>{ dragSrc = cardEl; cardEl.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; },
      onDragend:()=> cardEl.classList.remove("dragging"),
      onDragover:(e)=> e.preventDefault(),
      onDrop:(e)=>{
        e.preventDefault();
        if(dragSrc && dragSrc!==cardEl){
          const parent = grid;
          const srcIdx = Array.from(parent.children).indexOf(dragSrc);
          const tgtIdx = Array.from(parent.children).indexOf(cardEl);
          if(srcIdx < tgtIdx) parent.insertBefore(dragSrc, cardEl.nextSibling);
          else parent.insertBefore(dragSrc, cardEl);
        }
      }
    });
    if(!isSticky) cardEl.appendChild(el("div", {class:"pin"}));
    if(!state.examinedClues.has(def.key)) cardEl.appendChild(el("div", {class:"badge-new"}, "NEW"));
    cardEl.appendChild(el("span", {class:"evidence-icon"}, def.icon));
    cardEl.appendChild(el("div", {class:"evidence-label"}, def.label));
    cardEl.appendChild(el("div", {class:"evidence-hint"}, "Click to examine · Drag to rearrange"));
    grid.appendChild(cardEl);
  });
  cork.appendChild(grid);
  wrap.appendChild(cork);

  const footer = el("div", {class:"footer-actions"});
  footer.appendChild(el("button", {class:"btn ghost", onClick:()=> transitionTo("assign")}, "← Back to Case File"));
  const solveBtn = el("button", {class:"btn gold"}, "I'm Ready to Solve the Case →");
  solveBtn.addEventListener("click", ()=> transitionTo("solve"));
  footer.appendChild(solveBtn);
  wrap.appendChild(footer);
  return wrap;
}

/* ---------- SCREEN: SOLVE ---------- */
function buildMistakeOptions(c){
  const distractors = [];
  CASES.filter(x=>x.id!==c.id).forEach(x=> distractors.push(x.mistake));
  const wrongPool = shuffle(distractors).slice(0,3);
  const options = shuffle([c.mistake, ...wrongPool]);
  return options;
}

function screenSolve(){
  const c = state.currentCase;
  if(!state._mistakeOptions) state._mistakeOptions = buildMistakeOptions(c);
  const options = state._mistakeOptions;

  const wrap = el("div", {class:"screen"});
  const panel = el("div", {class:"solve-panel"});
  panel.appendChild(el("h2", {style:"color:var(--gold-bright);"}, "🧩 Solve the Case"));
  panel.appendChild(el("p", {style:"color:var(--paper-2);opacity:.85;"}, "Step 1 — Select the supporting clues that back your theory:"));

  const clueGrid = el("div", {class:"clue-select-grid"});
  c.clues.forEach((clueTxt, idx)=>{
    const picked = state.selectedClueIdx.has(idx);
    const mini = el("div", {
      class:"mini-evidence" + (picked ? " picked":""),
      onClick:()=>{
        if(state.selectedClueIdx.has(idx)) state.selectedClueIdx.delete(idx);
        else state.selectedClueIdx.add(idx);
        render();
      }
    }, "🔎 " + clueTxt);
    clueGrid.appendChild(mini);
  });
  panel.appendChild(clueGrid);

  panel.appendChild(el("p", {style:"color:var(--paper-2);opacity:.85;"}, "Step 2 — Identify the primary marketing mistake:"));
  const optList = el("div", {class:"option-list"});
  options.forEach((optTxt)=>{
    const isSelected = state.selectedMistakeOption === optTxt;
    let cls = "option-item";
    if(state.mistakeLocked){
      if(optTxt === c.mistake) cls += " correct";
      else if(isSelected) cls += " wrong";
    } else if(isSelected){
      cls += " selected";
    }
    const item = el("div", {
      class:cls,
      onClick:()=>{ if(!state.mistakeLocked){ state.selectedMistakeOption = optTxt; render(); } }
    }, optTxt);
    optList.appendChild(item);
  });
  panel.appendChild(optList);

  const footer = el("div", {class:"footer-actions"});
  if(!state.mistakeLocked){
    footer.appendChild(el("button", {class:"btn ghost", onClick:()=> transitionTo("board")}, "← Back to Board"));
    const submitBtn = el("button", {class:"btn gold"}, "Accuse & Lock In →");
    submitBtn.disabled = !state.selectedMistakeOption || state.selectedClueIdx.size===0;
    submitBtn.addEventListener("click", ()=>{
      state.mistakeLocked = true;
      let score = 0;
      if(state.selectedMistakeOption === c.mistake) score += 60;
      score += state.selectedClueIdx.size * 10;
      score += Math.max(0, 10 - Math.floor((Date.now()-state.startTime)/60000));
      state.score = Math.min(100, score);
      render();
    });
    footer.appendChild(submitBtn);
  } else {
    const nextBtn = el("button", {class:"btn gold"}, "See the Verdict →");
    nextBtn.addEventListener("click", ()=> transitionTo("closed"));
    footer.appendChild(nextBtn);
  }
  panel.appendChild(footer);
  wrap.appendChild(panel);
  return wrap;
}

/* ---------- SCREEN: CASE CLOSED ---------- */
function screenClosed(){
  const wrap = el("div", {class:"screen closed-screen"});
  const colors = ["#43c98a","#d8b25c","#e05a5a","#f2d089"];
  for(let i=0;i<40;i++){
    const piece = el("div", {class:"confetti-piece", style:
      `left:${Math.random()*100}%; background:${colors[i%colors.length]}; animation-duration:${2+Math.random()*2}s; animation-delay:${Math.random()*0.6}s;`
    });
    wrap.appendChild(piece);
  }
  wrap.appendChild(el("div", {class:"stamp-big"}, "CASE CLOSED"));
  const correct = state.selectedMistakeOption === state.currentCase.mistake;
  wrap.appendChild(el("div", {class:"score-line"}, correct ? "Sharp instincts, Detective." : "A twist you didn't see coming..."));
  wrap.appendChild(el("div", {class:"score-line"}, "Investigation Score"));
  wrap.appendChild(el("div", {class:"score-big"}, state.score + " / 100"));
  const btnRow = el("div", {class:"footer-actions"});
  btnRow.appendChild(el("button", {class:"btn gold", onClick:()=> transitionTo("report")}, "Read Full Learning Report →"));
  wrap.appendChild(btnRow);
  return wrap;
}

/* ---------- SCREEN: LEARNING REPORT ---------- */
function screenReport(){
  const c = state.currentCase;
  const wrap = el("div", {class:"screen"});
  const card = el("div", {class:"report-card"});
  card.appendChild(el("div", {class:"case-label"}, `Case File #${String(c.id).padStart(3,"0")} · Learning Report`));
  card.appendChild(el("h2", null, c.company));

  const sec1 = el("div", {class:"report-section"});
  sec1.appendChild(el("h3", null, "✅ The Correct Explanation"));
  sec1.appendChild(el("p", null, c.explanation));
  card.appendChild(sec1);

  const sec2 = el("div", {class:"report-section"});
  sec2.appendChild(el("h3", null, "🔎 Supporting Clues You Had"));
  const ul = el("ul", null);
  c.clues.forEach(cl=> ul.appendChild(el("li", null, cl)));
  sec2.appendChild(ul);
  card.appendChild(sec2);

  const sec3 = el("div", {class:"report-section"});
  sec3.appendChild(el("h3", null, "💡 Suggested Improvements"));
  const ul2 = el("ul", {class:"improve-list"});
  c.improvements.forEach(imp=> ul2.appendChild(el("li", null, imp)));
  sec3.appendChild(ul2);
  card.appendChild(sec3);

  const sec4 = el("div", {class:"report-section"});
  sec4.appendChild(el("h3", null, "📈 Your Performance"));
  sec4.appendChild(el("p", null, `Final Score: ${state.score}/100 · Clues selected: ${state.selectedClueIdx.size}/3 · Verdict: ${state.selectedMistakeOption===c.mistake ? "Correct mistake identified" : "Incorrect — review the explanation above"}`));
  const chipRow = el("div", {class:"chip-row"});
  ["Attribution Analysis","Root-Cause Thinking","Marketing Ops Awareness"].forEach(t=> chipRow.appendChild(el("span",{class:"chip"}, "🏅 "+t)));
  sec4.appendChild(chipRow);
  card.appendChild(sec4);

  wrap.appendChild(card);
  const footer = el("div", {class:"footer-actions"});
  footer.appendChild(el("button", {class:"btn ghost", onClick:()=>{
      state.currentCase = pickRandomCase(c.id);
      state.examinedClues = new Set();
      state.selectedMistakeOption = null;
      state.mistakeLocked = false;
      state.selectedClueIdx = new Set();
      state.score = 0;
      state.startTime = Date.now();
      state._mistakeOptions = null;
      transitionTo("assign");
  }}, "🔁 Investigate a New Case"));
  footer.appendChild(el("button", {class:"btn gold", onClick:()=> transitionTo("theme")}, "🎨 Change Theme & Restart"));
  wrap.appendChild(footer);
  return wrap;
}

/* ============================================================
   INIT
   ============================================================ */
applyTheme(state.theme);
render();

})();
</script>
</body>
</html>
